<!DOCTYPE html>
<html>
<head>
  <style>
    @font-face {
      font-family: 'Pecita';
      src: url('https://db.onlinewebfonts.com/t/5e605ff6994ce0e533aaf6cd51c6a33f.woff2') format('woff2');
    }
  </style>
</head>
<body>
  <div style="font-family: 'Pecita'; font-size: 80px; color: #53599A; text-shadow: 0px 0px 8px rgba(83, 89, 154, 0.6); position: absolute; left: -9999px;" id="preload">S</div>
  <canvas id="canvas" width="100" height="100" style="border: 1px solid black;"></canvas>
  <script>
    window.onload = () => {
      // Wait a bit for the font to load
      setTimeout(() => {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        ctx.font = '80px Pecita';
        ctx.fillStyle = '#53599A';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        // Add shadow
        ctx.shadowColor = 'rgba(83, 89, 154, 0.6)';
        ctx.shadowBlur = 8;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;
        
        ctx.fillText('S', 50, 50);
        
        const dataUrl = canvas.toDataURL('image/png');
        
        // Trigger download
        const a = document.createElement('a');
        a.href = dataUrl;
        a.download = 'favicon.png';
        a.click();
        
        document.body.innerHTML += '<div id="done">DONE</div>';
      }, 1000);
    };
  </script>
</body>
</html>
