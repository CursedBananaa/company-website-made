<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sha8lny</title>
  <script>
    // GitHub Pages SPA redirect trick
    // When GitHub Pages serves a 404, this page redirects back to index.html
    // preserving the intended URL as a query parameter.
    var segmentCount = 1; // matches the depth of your repo: /company-website-made/
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  Redirecting...
</body>
</html>
