  <script>
    window.addEventListener('load', () => {
      // Force font load if not already triggered
      const font = new FontFace('Pecita', 'url(https://db.onlinewebfonts.com/t/5e605ff6994ce0e533aaf6cd51c6a33f.woff2)');
      font.load().then((loadedFont) => {
        document.fonts.add(loadedFont);
        
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');
        
        ctx.font = '50px Pecita';
        ctx.fillStyle = '#53599A';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        ctx.shadowColor = 'rgba(83, 89, 154, 0.6)';
        ctx.shadowBlur = 6;
        
        // Draw the S slightly offset to account for cursive leaning
        ctx.fillText('S', 32, 36);
        
        const link = document.getElementById('dynamic-favicon');
        if (link) {
          link.type = 'image/png';
          link.href = canvas.toDataURL('image/png');
        }
      }).catch(console.error);
    });
  </script>
